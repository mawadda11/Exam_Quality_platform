[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-exam-quality-backend"
version = "2.0.0rc1"
description = "FastAPI backend for Exam Quality Analyzer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.12,<1",
  "alembic>=1.13,<2",
  "pdfplumber>=0.11,<1",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<13",
  "fpdf2>=2.8,<3",
  # Required by fpdf2 for Arabic glyph joining and bidirectional shaping.
  "uharfbuzz>=0.39,<1",
  "pytesseract>=0.3,<1",
  "argon2-cffi>=23.1,<26",
  "PyJWT>=2.9,<3",
  "openpyxl>=3.1,<4",
  "chromadb==1.5.9",
  "anthropic>=0.68,<1",
  "google-genai>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "types-openpyxl>=3.1,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "I001", "UP035", "B007"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "pytesseract.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
