[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-exam-quality-backend"
version = "1.0.0"
description = "FastAPI backend for the AI Exam Quality Platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.12,<1",
  "alembic>=1.13,<2",
  "pdfplumber>=0.11,<1",
  "fpdf2>=2.8,<3",
  "pytesseract>=0.3,<1",
  "argon2-cffi>=23.1,<26",
  "PyJWT>=2.9,<3",
  # Runtime KB lookups and semantic indexing read the controlled .xlsx
  # sources; this cannot remain dev-only now that API/pipeline code imports it.
  "openpyxl>=3.1,<4",
  # Exact-pinned (unlike the ranges above): Chroma's client/server wire
  # protocol has changed across versions, and docker-compose.yml's chromadb
  # image is pinned to this exact same version to match.
  "chromadb==1.5.9",
  "anthropic>=0.68,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "types-openpyxl>=3.1,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# pytesseract ships no inline types and no types-pytesseract stub package
# exists on PyPI - narrowly scoped to just this module rather than weakening
# strict mode project-wide.
[[tool.mypy.overrides]]
module = "pytesseract.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
